name: Deploy a GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si Pages sigue en "Deploy from a branch", GitHub también publica los archivos sin compilar
      # y la página sale en blanco. Esperamos a que termine para que esta versión quede encima.
      # (Se puede quitar cuando Settings → Pages → Source esté en "GitHub Actions".)
      - name: Esperar a la publicación automática de GitHub
        run: sleep 75
      - id: deployment
        uses: actions/deploy-pages@v4
